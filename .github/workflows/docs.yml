name: Docs

# Publish the site: the homepage, the guide and the generated API reference,
# all from `docs/`. The API page is regenerated here and the build fails if the
# committed copy is stale, so the published reference always matches the code.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: interface files
        run: |
          moon update
          moon info

      - name: api reference is current
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      # The showcase's playground calls the library itself, so the bundle is
      # rebuilt here rather than trusted from the commit: what ships must match
      # the code that just built.
      - name: browser build
        run: python3 scripts/build_web.py

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
